
<!DOCTYPE html>
<html>
<head>
    <title>Social media share sample</title>
<style>

</style>
</head>
<body>

<div class="container">
    <div class="bottom1">
        <dl class="share">
          <dt><img src="/tv/digimon/images/common/share.png" alt="シェアする"></dt>
          <dd><a href="javascript:void(0)" onclick="shares(location.href+'&amp;text='+encodeURIComponent(document.title),'twitter')">
            <img src="share-tw.png" alt=""></a></dd>
          <dd><a href="javascript:void(0)" onclick="shares(location.href,'facebook')">
            <img src="share-fb.png" alt=""></a></dd>
          <dd><a href="javascript:void(0)" onclick="shares(document.title + ' ' + location.href,'line')">
            <img src="share-line.png" alt=""></a></dd>
        </dl>
        </div>
</div>
<script>
    function shares(url, type) {
    switch (type) {
        case "facebook":
            window.open('https://www.facebook.com/share.php?u=' + url, 'FBwindow', 'width=550, height=450, menubar=no, toolbar=no, scrollbars=yes');
            break;
        case "twitter":
            window.open('https://twitter.com/share?url=' + url, 'TWwindow', 'width=550, height=450, menubar=no, toolbar=no, scrollbars=yes');
            break;
        case "line":
            window.open('http://line.naver.jp/R/msg/text/?' + url, '', '');
            break;
    }
    return false;
}


</script>
</body>
</html>
